name: Gemini PR Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # Необходимо для добавления комментариев к PR

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai requests

      - name: Run Gemini Review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          python -c "
          import os, requests
          from google import genai

          # 1. Получаем diff (изменения) текущего Pull Request
          diff_url = f'https://api.github.com/repos/{os.environ[\"REPO\"]}/pulls/{os.environ[\"PR_NUMBER\"]}'
          headers = {
              'Authorization': f'Bearer {os.environ[\"GITHUB_TOKEN\"]}',
              'Accept': 'application/vnd.github.v3.diff'
          }
          diff_response = requests.get(diff_url, headers=headers)
          diff_text = diff_response.text

          if not diff_text.strip():
              print('Нет изменений для анализа.')
              exit(0)

          # 2. Отправляем diff в Gemini
          client = genai.Client(api_key=os.environ['GEMINI_API_KEY'])
          prompt = f'''
          Пожалуйста, проведи код-ревью следующих изменений (git diff). 
          Укажи на потенциальные баги, уязвимости, проблемы с производительностью и предложи улучшения чистоты кода.
          Отвечай в формате Markdown.
          
          Изменения:
          {diff_text}
          '''
          
          response = client.models.generate_content(
    model='gemini-3.6-flash',
    contents=prompt
)

          # 3. Публикуем ответ Gemini как комментарий к PR
          comment_url = f'https://api.github.com/repos/{os.environ[\"REPO\"]}/issues/{os.environ[\"PR_NUMBER\"]}/comments'
          requests.post(
              comment_url,
              headers={'Authorization': f'Bearer {os.environ[\"GITHUB_TOKEN\"]}'},
              json={'body': '### 🤖 Gemini AI Code Review\n\n' + response.text}
          )
          "